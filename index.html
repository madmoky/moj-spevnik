<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Môj gitarový spevník</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .song-sheet {
      font-family: 'Courier New', Courier, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .chord-line {
      color: #d97706;
      font-weight: 700;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen flex flex-col">

  <!-- Horná lišta -->
  <header class="bg-stone-900 text-white sticky top-0 z-20 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 cursor-pointer" onclick="zobrazZoznam()">
        <span class="text-2xl">🎸</span>
        <div>
          <h1 class="font-bold text-lg leading-tight">Môj spevník</h1>
          <p id="stav-pripojenia" class="text-xs text-stone-400">Pripájam sa k cloudu...</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="otvorWebHladanie()" class="bg-stone-700 hover:bg-stone-600 text-sm px-3 py-2 rounded-lg transition">
          🔍 Hľadať akordy na webe
        </button>
        <button onclick="otvorFormular()" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm px-4 py-2 rounded-lg shadow transition">
          + Pridať pieseň
        </button>
      </div>
    </div>
  </header>

  <!-- Hlavný obsah -->
  <main class="max-w-5xl w-full mx-auto px-4 py-6 flex-1">

    <!-- POHĽAD 1: Zoznam piesní -->
    <section id="pohlad-zoznam">
      <div class="mb-5">
        <input
          type="text"
          id="vyhladavanie"
          oninput="filtrujPiesne()"
          placeholder="Hľadať podľa názvu piesne, interpreta alebo textu..."
          class="w-full px-4 py-3 rounded-xl border border-stone-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
        />
      </div>

      <div id="zoznam-kariet" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-stone-500 text-sm">Načítavam piesne...</p>
      </div>
    </section>

    <!-- POHĽAD 2: Detail piesne (hranie) -->
    <section id="pohlad-detail" class="hidden">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
        <button onclick="zobrazZoznam()" class="text-stone-600 hover:text-stone-900 font-medium text-sm flex items-center gap-1">
          ← Späť na zoznam
        </button>
        <div class="flex gap-2">
          <button onclick="upravAktualnuPiesen()" class="bg-stone-200 hover:bg-stone-300 text-stone-800 text-sm px-3 py-1.5 rounded-lg">
            ✏️ Upraviť
          </button>
          <button onclick="zmazAktualnuPiesen()" class="bg-red-100 hover:bg-red-200 text-red-700 text-sm px-3 py-1.5 rounded-lg">
            🗑️ Zmazať
          </button>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-5 md:p-8">
        <div class="border-b border-stone-200 pb-4 mb-5 flex flex-wrap items-end justify-between gap-4">
          <div>
            <h2 id="detail-nazov" class="text-2xl md:text-3xl font-bold text-stone-900"></h2>
            <p id="detail-interpret" class="text-stone-500 font-medium mt-1"></p>
          </div>

          <!-- Ovládací panel pre gitaristu -->
          <div class="flex flex-wrap items-center gap-2 bg-stone-100 p-2 rounded-xl">
            <span class="text-xs font-semibold text-stone-500 px-1">Tónina:</span>
            <button onclick="zmenToninu(-1)" class="bg-white hover:bg-stone-200 border border-stone-300 px-2.5 py-1 rounded font-bold text-sm">-1</button>
            <span id="posun-ukazovatel" class="text-xs font-mono font-bold w-8 text-center">0</span>
            <button onclick="zmenToninu(1)" class="bg-white hover:bg-stone-200 border border-stone-300 px-2.5 py-1 rounded font-bold text-sm">+1</button>

            <div class="h-5 w-px bg-stone-300 mx-1"></div>

            <button onclick="zmenPismo(-2)" class="bg-white hover:bg-stone-200 border border-stone-300 px-2.5 py-1 rounded text-sm">A-</button>
            <button onclick="zmenPismo(2)" class="bg-white hover:bg-stone-200 border border-stone-300 px-2.5 py-1 rounded text-sm">A+</button>

            <div class="h-5 w-px bg-stone-300 mx-1"></div>

            <button id="btn-scroll" onclick="prepniAutoScroll()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-sm font-medium">
              ▶ Auto-posuv
            </button>
          </div>
        </div>

        <!-- Diagramy akordov (hmatníky) -->
        <div id="sekcia-diagramy" class="mb-6 bg-stone-50 p-4 rounded-xl border border-stone-200">
          <p class="text-xs font-bold uppercase tracking-wider text-stone-500 mb-3">Použité akordy v piesni (prstoklad):</p>
          <div id="zoznam-diagramov" class="flex flex-wrap gap-3"></div>
        </div>

        <!-- Samotný text a akordy -->
        <div id="detail-obsah" class="song-sheet text-base md:text-lg overflow-x-auto pb-12"></div>
      </div>
    </section>

    <!-- POHĽAD 3: Formulár na pridanie / úpravu piesne -->
    <section id="pohlad-formular" class="hidden">
      <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 id="formular-nadpis" class="text-xl font-bold">Pridať novú pieseň</h2>
          <button onclick="zobrazZoznam()" class="text-stone-500 hover:text-stone-800 text-sm">✕ Zavrieť</button>
        </div>

        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Názov piesne *</label>
              <input type="text" id="input-nazov" placeholder="napr. Voda čo ma drží nad vodou" class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" />
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Interpret</label>
              <input type="text" id="input-interpret" placeholder="napr. Elán" class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" />
            </div>
          </div>

          <div>
            <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
              <label class="block text-sm font-semibold">Text a akordy (stačí skopírovať z internetu) *</label>
              <button type="button" onclick="vlozZoSchranky()" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold px-2.5 py-1 rounded">
                📋 Vložiť zo schránky (Ctrl+V)
              </button>
            </div>
            <p class="text-xs text-stone-500 mb-2">Tip: Na webe (napr. Supermusic) označ text aj s akordami nad slovami, skopíruj ho a vlož sem. Žiadne zátvorky netreba.</p>
            <textarea
              id="input-obsah"
              rows="14"
              placeholder="    G              D&#10;Keď sa večer zotmieva,&#10;    Em             C&#10;vietor v korunách spieva..."
              class="w-full px-3 py-2 border border-stone-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
            ></textarea>
          </div>

          <div class="flex justify-end gap-3 pt-2">
            <button type="button" onclick="zobrazZoznam()" class="px-4 py-2 rounded-lg border border-stone-300 text-stone-700 hover:bg-stone-100">
              Zrušiť
            </button>
            <button type="button" onclick="ulozPiesen()" id="btn-ulozit" class="px-6 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-semibold shadow">
              💾 Uložiť do cloudu
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // =========================================================================
    // 1. NASTAVENIE SUPABASE
    // =========================================================================
    const SUPABASE_URL = "https://gruzgybwhzpdqohtpczz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UZHGORsCIRR92z1hyR6oqA_1MAZYafm";
    // =========================================================================

    let db = null;
    let vsetkyPiesne = [];
    let aktualnaPiesen = null;
    let upravovaneId = null;
    let aktualnyPosun = 0;
    let velkostPisma = 17;
    let scrollInterval = null;

    // Databáza prstokladov pre začiatočníkov [struny E A D G B e], -1 = nehrať, 0 = prázdna struna
    const HMATNIKY = {
      "C":   [-1, 3, 2, 0, 1, 0],
      "Cm":  [-1, 3, 5, 5, 4, 3],
      "C7":  [-1, 3, 2, 3, 1, 0],
      "D":   [-1, -1, 0, 2, 3, 2],
      "Dm":  [-1, -1, 0, 2, 3, 1],
      "D7":  [-1, -1, 0, 2, 1, 2],
      "E":   [0, 2, 2, 1, 0, 0],
      "Em":  [0, 2, 2, 0, 0, 0],
      "E7":  [0, 2, 0, 1, 0, 0],
      "F":   [1, 3, 3, 2, 1, 1],
      "Fm":  [1, 3, 3, 1, 1, 1],
      "Fmaj7": [-1, -1, 3, 2, 1, 0],
      "G":   [3, 2, 0, 0, 0, 3],
      "Gm":  [3, 5, 5, 3, 3, 3],
      "G7":  [3, 2, 0, 0, 0, 1],
      "A":   [-1, 0, 2, 2, 2, 0],
      "Am":  [-1, 0, 2, 2, 1, 0],
      "A7":  [-1, 0, 2, 0, 2, 0],
      "H":   [-1, 2, 4, 4, 4, 2],
      "B":   [-1, 2, 4, 4, 4, 2],
      "Hm":  [-1, 2, 4, 4, 3, 2],
      "Bm":  [-1, 2, 4, 4, 3, 2],
      "H7":  [-1, 2, 1, 2, 0, 2],
      "B7":  [-1, 2, 1, 2, 0, 2]
    };

    const NOTY_KRIZIKY = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "H"];
    const NOTY_BECKA   = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "H"];

    // Štart aplikácie
    window.addEventListener("DOMContentLoaded", async () => {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      await nacitajPiesne();
    });

    async function nacitajPiesne() {
      const stav = document.getElementById("stav-pripojenia");
      stav.textContent = "Synchronizujem...";

      const { data, error } = await db
        .from("piesne")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        stav.textContent = "Chyba pripojenia k databáze";
        alert("Nepodarilo sa načítať piesne: " + error.message);
        return;
      }

      vsetkyPiesne = data || [];
      stav.textContent = `Pripojené • ${vsetkyPiesne.length} piesní v cloude`;
      stav.classList.replace("text-stone-400", "text-emerald-400");
      vykresliZoznam(vsetkyPiesne);
    }

    function vykresliZoznam(zoznam) {
      const kontajner = document.getElementById("zoznam-kariet");
      if (zoznam.length === 0) {
        kontajner.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-2xl border border-dashed border-stone-300 text-center">
            <p class="text-lg font-semibold text-stone-700">Zatiaľ tu nemáš žiadne piesne</p>
            <p class="text-sm text-stone-500 mt-1 mb-4">Klikni na „Hľadať akordy na webe“, skopíruj si obľúbenú pesničku a ulož ju sem.</p>
            <button onclick="otvorFormular()" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Pridať prvú pieseň</button>
          </div>`;
        return;
      }

      kontajner.innerHTML = zoznam.map(p => `
        <div onclick="otvorDetail(${p.id})" class="bg-white p-4 rounded-xl border border-stone-200 hover:border-amber-500 shadow-sm cursor-pointer transition flex justify-between items-center">
          <div>
            <h3 class="font-bold text-lg text-stone-900">${unikniHTML(p.nazov)}</h3>
            <p class="text-sm text-stone-500">${unikniHTML(p.interpret || "Neznámy interpret")}</p>
          </div>
          <span class="text-amber-600 font-bold text-sm">Otvoriť →</span>
        </div>
      `).join("");
    }

    function filtrujPiesne() {
      const q = document.getElementById("vyhladavanie").value.toLowerCase().trim();
      const filtrovane = vsetkyPiesne.filter(p =>
        (p.nazov && p.nazov.toLowerCase().includes(q)) ||
        (p.interpret && p.interpret.toLowerCase().includes(q)) ||
        (p.obsah && p.obsah.toLowerCase().includes(q))
      );
      vykresliZoznam(filtrovane);
    }

    function jeAkord(slovo) {
      const ciste = slovo.replace(/[()|\[\]]/g, "");
      if (!ciste) return false;
      return /^[A-H](#|b)?(m|mi|min|maj|dim|aug|sus|add)?[0-9]*(\/[A-H](#|b)?)?$/.test(ciste);
    }

    function jeRiadokSAkordami(riadok) {
      const slova = riadok.trim().split(/\s+/).filter(Boolean);
      if (slova.length === 0) return false;
      const pocetAkordov = slova.filter(jeAkord).length;
      return (pocetAkordov / slova.length) >= 0.6;
    }

    function posunAkord(akord, poltony) {
      return akord.replace(/([A-H])(#|b)?/g, (zhoda, zaklad, posuvka) => {
        let nota = zaklad + (posuvka || "");
        if (nota === "B") nota = "H";
        let index = NOTY_KRIZIKY.indexOf(nota);
        if (index === -1) index = NOTY_BECKA.indexOf(nota);
        if (index === -1) return zhoda;

        let novyIndex = (index + poltony) % 12;
        if (novyIndex < 0) novyIndex += 12;
        return NOTY_KRIZIKY[novyIndex];
      });
    }

    function spracujObsahPiesne(text, poltony) {
      const riadky = text.split("\n");
      const najdeneAkordy = new Set();

      const htmlRiadky = riadky.map(riadok => {
        if (jeRiadokSAkordami(riadok)) {
          const upravenyRiadok = riadok.replace(/\S+/g, token => {
            if (jeAkord(token)) {
              const novyToken = posunAkord(token, poltony);
              const zakladPreDiagram = novyToken.replace(/[()|\[\]]/g, "").split("/")[0];
              najdeneAkordy.add(zakladPreDiagram);
              return novyToken;
            }
            return token;
          });
          return `<div class="chord-line">${unikniHTML(upravenyRiadok)}</div>`;
        } else {
          return `<div>${unikniHTML(riadok) || "&nbsp;"}</div>`;
        }
      });

      return { html: htmlRiadky.join(""), akordy: Array.from(najdeneAkordy) };
    }

    function vykresliSVGDiagram(nazovAkordu, prsty) {
      const sirka = 76, vyska = 92;
      const startX = 14, startY = 22;
      const rozostupStrun = 10, rozostupPrazcov = 14;

      let svg = `<svg width="${sirka}" height="${vyska}" class="bg-white rounded-lg border border-stone-200 shadow-xs">`;
      svg += `<text x="${sirka / 2}" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c1917">${nazovAkordu}</text>`;
      svg += `<line x1="${startX}" y1="${startY}" x2="${startX + 5 * rozostupStrun}" y2="${startY}" stroke="#1c1917" stroke-width="2.5"/>`;

      for (let i = 0; i < 6; i++) {
        const x = startX + i * rozostupStrun;
        svg += `<line x1="${x}" y1="${startY}" x2="${x}" y2="${startY + 4 * rozostupPrazcov}" stroke="#a8a29e" stroke-width="1"/>`;
      }
      for (let p = 1; p <= 4; p++) {
        const y = startY + p * rozostupPrazcov;
        svg += `<line x1="${startX}" y1="${y}" x2="${startX + 5 * rozostupStrun}" y2="${y}" stroke="#a8a29e" stroke-width="1"/>`;
      }

      prsty.forEach((prazec, struna) => {
        const x = startX + struna * rozostupStrun;
        if (prazec === -1) {
          svg += `<text x="${x}" y="${startY - 3}" text-anchor="middle" font-size="8" fill="#dc2626">×</text>`;
        } else if (prazec === 0) {
          svg += `<circle cx="${x}" cy="${startY - 5}" r="2.2" fill="none" stroke="#16a34a" stroke-width="1.2"/>`;
        } else if (prazec <= 4) {
          const y = startY + (prazec - 0.5) * rozostupPrazcov;
          svg += `<circle cx="${x}" cy="${y}" r="3.6" fill="#d97706"/>`;
        }
      });

      svg += `</svg>`;
      return svg;
    }

    function otvorDetail(id) {
      aktualnaPiesen = vsetkyPiesne.find(p => p.id === id);
      if (!aktualnaPiesen) return;

      aktualnyPosun = 0;
      zastavAutoScroll();
      prekresliDetail();

      document.getElementById("pohlad-zoznam").classList.add("hidden");
      document.getElementById("pohlad-formular").classList.add("hidden");
      document.getElementById("pohlad-detail").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function prekresliDetail() {
      document.getElementById("detail-nazov").textContent = aktualnaPiesen.nazov;
      document.getElementById("detail-interpret").textContent = aktualnaPiesen.interpret || "Neznámy interpret";
      document.getElementById("posun-ukazovatel").textContent = (aktualnyPosun > 0 ? "+" : "") + aktualnyPosun;

      const vysledok = spracujObsahPiesne(aktualnaPiesen.obsah, aktualnyPosun);
      const obsahEl = document.getElementById("detail-obsah");
      obsahEl.innerHTML = vysledok.html;
      obsahEl.style.fontSize = velkostPisma + "px";

      const diagramyKontajner = document.getElementById("zoznam-diagramov");
      const sekciaDiagramy = document.getElementById("sekcia-diagramy");
      const znameAkordy = vysledok.akordy.filter(a => HMATNIKY[a]);

      if (znameAkordy.length > 0) {
        sekciaDiagramy.classList.remove("hidden");
        diagramyKontajner.innerHTML = znameAkordy.map(a => vykresliSVGDiagram(a, HMATNIKY[a])).join("");
      } else {
        sekciaDiagramy.classList.add("hidden");
      }
    }

    function zmenToninu(krok) {
      aktualnyPosun += krok;
      prekresliDetail();
    }

    function zmenPismo(rozdiel) {
      velkostPisma = Math.max(12, Math.min(28, velkostPisma + rozdiel));
      document.getElementById("detail-obsah").style.fontSize = velkostPisma + "px";
    }

    function prepniAutoScroll() {
      const btn = document.getElementById("btn-scroll");
      if (scrollInterval) {
        zastavAutoScroll();
      } else {
        btn.textContent = "⏸ Zastaviť posuv";
        btn.classList.replace("bg-amber-600", "bg-red-600");
        scrollInterval = setInterval(() => {
          window.scrollBy(0, 1);
        }, 45);
      }
    }

    function zastavAutoScroll() {
      if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
      }
      const btn = document.getElementById("btn-scroll");
      btn.textContent = "▶ Auto-posuv";
      btn.classList.replace("bg-red-600", "bg-amber-600");
    }

    function otvorFormular() {
      upravovaneId = null;
      document.getElementById("formular-nadpis").textContent = "Pridať novú pieseň";
      document.getElementById("input-nazov").value = "";
      document.getElementById("input-interpret").value = "";
      document.getElementById("input-obsah").value = "";

      document.getElementById("pohlad-zoznam").classList.add("hidden");
      document.getElementById("pohlad-detail").classList.add("hidden");
      document.getElementById("pohlad-formular").classList.remove("hidden");
    }

    function upravAktualnuPiesen() {
      if (!aktualnaPiesen) return;
      upravovaneId = aktualnaPiesen.id;
      document.getElementById("formular-nadpis").textContent = "Upraviť pieseň";
      document.getElementById("input-nazov").value = aktualnaPiesen.nazov;
      document.getElementById("input-interpret").value = aktualnaPiesen.interpret || "";
      document.getElementById("input-obsah").value = aktualnaPiesen.obsah;

      document.getElementById("pohlad-detail").classList.add("hidden");
      document.getElementById("pohlad-formular").classList.remove("hidden");
    }

    async function vlozZoSchranky() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("input-obsah").value = text;
      } catch (err) {
        alert("Prehliadač zablokoval automatické vloženie. Klikni do textového poľa a stlač Ctrl+V.");
      }
    }

    async function ulozPiesen() {
      if (!db) return alert("Databáza nie je pripojená.");

      const nazov = document.getElementById("input-nazov").value.trim();
      const interpret = document.getElementById("input-interpret").value.trim();
      const obsah = document.getElementById("input-obsah").value;

      if (!nazov || !obsah.trim()) {
        return alert("Zadaj prosím aspoň názov piesne a text s akordami.");
      }

      const btn = document.getElementById("btn-ulozit");
      btn.disabled = true;
      btn.textContent = "Ukladám...";

      let chyba = null;
      if (upravovaneId) {
        const { error } = await db
          .from("piesne")
          .update({ nazov, interpret, obsah })
          .eq("id", upravovaneId);
        chyba = error;
      } else {
        const { error } = await db
          .from("piesne")
          .insert([{ nazov, interpret, obsah }]);
        chyba = error;
      }

      btn.disabled = false;
      btn.textContent = "💾 Uložiť do cloudu";

      if (chyba) {
        return alert("Chyba pri ukladaní: " + chyba.message);
      }

      await nacitajPiesne();
      zobrazZoznam();
    }

    async function zmazAktualnuPiesen() {
      if (!aktualnaPiesen || !db) return;
      if (!confirm(`Naozaj chceš zmazať pieseň „${aktualnaPiesen.nazov}“?`)) return;

      const { error } = await db.from("piesne").delete().eq("id", aktualnaPiesen.id);
      if (error) return alert("Chyba pri mazaní: " + error.message);

      await nacitajPiesne();
      zobrazZoznam();
    }

    function zobrazZoznam() {
      zastavAutoScroll();
      document.getElementById("pohlad-detail").classList.add("hidden");
      document.getElementById("pohlad-formular").classList.add("hidden");
      document.getElementById("pohlad-zoznam").classList.remove("hidden");
    }

    function otvorWebHladanie() {
      const hladanyVyraz = prompt("Zadaj názov piesne alebo interpreta, ktorého chceš nájsť:");
      if (hladanyVyraz && hladanyVyraz.trim()) {
        const q = encodeURIComponent(hladanyVyraz.trim() + " akordy");
        window.open(`https://www.google.com/search?q=${q}`, "_blank");
      }
    }

    function unikniHTML(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[m]));
    }
  </script>
